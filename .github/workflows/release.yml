name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Release (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag matches version metadata
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VER="${TAG#v}"
          PLIST_VER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          PLIST_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Resources/Info.plist)"
          SWIFT_VER="$(sed -n 's/.*public static let current = "\([^"]*\)".*/\1/p' Sources/DaykitCore/Domain.swift)"
          echo "TAG=$TAG VER=$VER PLIST=$PLIST_VER ($PLIST_BUILD) SWIFT=$SWIFT_VER"
          test -n "$VER"
          test "$PLIST_VER" = "$VER"
          test "$PLIST_BUILD" = "$VER"
          test "$SWIFT_VER" = "$VER"

      - name: Build and test
        run: |
          swift build -c release
          swift test

      - name: Verify embedded Info.plist and smoke checks
        run: |
          VER="${GITHUB_REF#refs/tags/v}"
          BIN="$(swift build -c release --show-bin-path)/daykit"
          otool -P "$BIN" | grep -q 'dev.gabrielcabrera.daykit'
          otool -P "$BIN" | grep -q 'NSCalendarsFullAccessUsageDescription'
          otool -P "$BIN" | grep -q 'NSRemindersFullAccessUsageDescription'
          test "$("$BIN" --version)" = "$VER"
          "$BIN" doctor | jq -e --arg v "$VER" '.schema_version == 1 and .ok == true and .data.daykit_version == $v'

      - name: Package source archive and SHA256SUMS
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VER="${TAG#v}"
          mkdir -p dist
          git archive --format=tar.gz --prefix="daykit-${VER}/" -o "dist/daykit-${TAG}-source.tar.gz" "$TAG"
          (cd dist && shasum -a 256 "daykit-${TAG}-source.tar.gz" > SHA256SUMS && cat SHA256SUMS)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "dist/daykit-${TAG}-source.tar.gz" "dist/SHA256SUMS" \
              --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" \
              "dist/daykit-${TAG}-source.tar.gz" "dist/SHA256SUMS" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$TAG" \
              --generate-notes
          fi
